name: Release & Distribution

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      channel:
        description: "Release channel (beta or stable)"
        required: true
        default: "beta"
        type: choice
        options:
          - beta
          - stable
      tag:
        description: "Version tag (e.g. v0.1.0 or v0.1.0-beta.1). Leave empty to use Cargo.toml version."
        required: false
        default: ""

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  determine-release:
    name: Determine Release Metadata
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      is_prerelease: ${{ steps.meta.outputs.is_prerelease }}
      channel: ${{ steps.meta.outputs.channel }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: |
          # Determine tag / version
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.tag }}" ]; then
            TAG="${{ github.event.inputs.tag }}"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            CARGO_VER=$(cargo metadata --no-deps --format-version 1 | grep -o '"name":"tag","version":"[^"]*"' | head -n 1 | cut -d'"' -f6)
            if [ "${{ github.event.inputs.channel }}" = "beta" ]; then
              TAG="v${CARGO_VER}-beta.${{ github.run_number }}"
            else
              TAG="v${CARGO_VER}"
            fi
          else
            TAG="${{ github.ref_name }}"
          fi

          # Determine if beta / prerelease
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            CHANNEL="${{ github.event.inputs.channel }}"
          elif [[ "$TAG" == *"-beta"* || "$TAG" == *"-alpha"* || "$TAG" == *"-rc"* ]]; then
            CHANNEL="beta"
          else
            CHANNEL="stable"
          fi

          if [ "$CHANNEL" = "beta" ]; then
            IS_PRERELEASE="true"
          else
            IS_PRERELEASE="false"
          fi

          echo "version=$TAG" >> $GITHUB_OUTPUT
          echo "is_prerelease=$IS_PRERELEASE" >> $GITHUB_OUTPUT
          echo "channel=$CHANNEL" >> $GITHUB_OUTPUT

          echo "Determined Version: $TAG"
          echo "Release Channel:    $CHANNEL"
          echo "Is Pre-release:     $IS_PRERELEASE"

  build-binaries:
    name: Build (${{ matrix.target }})
    needs: determine-release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64 glibc
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            use_cross: false

          # Linux x86_64 static musl (runs on any Linux distro)
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            use_cross: false

          # Linux aarch64 (ARM64)
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            use_cross: true

          # macOS Apple Silicon (M1/M2/M3/M4)
          - os: macos-latest
            target: aarch64-apple-darwin
            use_cross: false

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl-tools (for musl builds)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Install Cross (for cross-compilation)
        if: matrix.use_cross
        uses: taiki-e/install-action@cross

      - name: Build Release Binaries
        run: |
          if [ "${{ matrix.use_cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }} --workspace
          else
            cargo build --release --target ${{ matrix.target }} --workspace
          fi

      - name: Package Release Archive
        shell: bash
        run: |
          VERSION="${{ needs.determine-release.outputs.version }}"
          TARGET="${{ matrix.target }}"
          STAGE="tag-${VERSION}-${TARGET}"
          mkdir -p "$STAGE"

          BIN_DIR="target/${TARGET}/release"
          cp "$BIN_DIR/tag" "$STAGE/"
          cp "$BIN_DIR/cockpit-notify" "$STAGE/"
          cp "$BIN_DIR/tag-notify" "$STAGE/"
          cp README.md "$STAGE/"

          ARCHIVE="${STAGE}.tar.gz"
          tar -czvf "$ARCHIVE" -C "$STAGE" .

          # Generate SHA-256 checksum
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$ARCHIVE" > "${ARCHIVE}.sha256"
          else
            shasum -a 256 "$ARCHIVE" > "${ARCHIVE}.sha256"
          fi

          mkdir dist
          mv "$ARCHIVE" dist/
          mv "${ARCHIVE}.sha256" dist/

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-${{ matrix.target }}
          path: dist/*
          retention-days: 1

  publish-release:
    name: Publish GitHub Release
    needs: [determine-release, build-binaries]
    runs-on: ubuntu-latest
    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-dist
          merge-multiple: true

      - name: Generate Consolidated SHA256SUMS
        shell: bash
        run: |
          cd all-dist
          cat *.sha256 > SHA256SUMS.txt
          ls -la

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.determine-release.outputs.version }}
          name: TAG ${{ needs.determine-release.outputs.version }} (${{ needs.determine-release.outputs.channel }})
          prerelease: ${{ needs.determine-release.outputs.is_prerelease == 'true' }}
          make_latest: ${{ needs.determine-release.outputs.is_prerelease != 'true' }}
          generate_release_notes: true
          files: |
            all-dist/*.tar.gz
            all-dist/*.sha256
            all-dist/SHA256SUMS.txt

  publish-crates:
    name: Publish to crates.io (Stable Only)
    needs: [determine-release, publish-release]
    runs-on: ubuntu-latest
    # Only run for stable releases
    if: needs.determine-release.outputs.is_prerelease != 'true'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Publish Crates in Topological Order
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "==> CRATES_IO_TOKEN secret is not set, skipping crates.io publishing."
            exit 0
          fi
          echo "==> Publishing workspace crates to crates.io..."
          # Publish foundational crates first
          cargo publish -p tag-core
          sleep 15
          cargo publish -p tag-pty
          cargo publish -p tag-layout
          cargo publish -p tag-keys
          cargo publish -p tag-vault
          cargo publish -p tag-notify
          cargo publish -p tag-git
          cargo publish -p tag-clipboard
          cargo publish -p tag-usage
          cargo publish -p tag-agents
          cargo publish -p tag-applets
          cargo publish -p tag-ui
          sleep 20
          # Publish main binary crate
          cargo publish -p tag
          echo "==> Published TAG to crates.io!"
