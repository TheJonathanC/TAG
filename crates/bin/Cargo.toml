[package]
name = "tag"
version = "0.1.0-beta.3"
edition = "2021"
description = "Terminal Agent Orchestrator & Developer Multiplexer"
license = "MIT OR Apache-2.0"
repository = "https://github.com/TheJonathanC/TAG"
homepage = "https://github.com/TheJonathanC/TAG"
readme = "../../README.md"
keywords = ["terminal", "multiplexer", "agent", "pty", "tui"]
categories = ["command-line-utilities", "development-tools"]
default-run = "tag"

[[bin]]
name = "tag"
path = "src/main.rs"

[[bin]]
name = "cockpit-notify"
path = "src/notify_bin.rs"

[[bin]]
name = "tag-notify"
path = "src/tag_notify.rs"

[dependencies]
tag-core = { path = "../core", version = "0.1.0" }
tag-pty = { path = "../pty", version = "0.1.0" }
tag-layout = { path = "../layout", version = "0.1.0" }
tag-keys = { path = "../keys", version = "0.1.0" }
tag-ui = { path = "../ui", version = "0.1.0" }
tag-git = { path = "../git", version = "0.1.0" }
tag-clipboard = { path = "../clipboard", version = "0.1.0" }
tag-vault = { path = "../vault", version = "0.1.0" }
tag-agents = { path = "../agents", version = "0.1.0" }
tag-notify = { path = "../notify", version = "0.1.0" }
tag-usage = { path = "../usage", version = "0.1.0" }
tag-applets = { path = "../applets", version = "0.1.0" }
tokio = { workspace = true }
ratatui = { workspace = true }
crossterm = { workspace = true }
clap = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
arboard = { workspace = true }
